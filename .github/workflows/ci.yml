name: Docklane checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docklane
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: docklane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docklane -d docklane_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: 'true'
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://docklane:ci-only-password@127.0.0.1:5432/docklane_test
      REDIS_URL: redis://127.0.0.1:6379
      DOCKLANE_LOCAL_E2E: '1'
      VITE_NEON_AUTH_URL: https://identity.example.test/auth
      VITE_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run prove:concurrency
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
