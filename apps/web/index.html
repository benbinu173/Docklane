<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101d2c" />
    <script>
      ;(() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('docklane.color-theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101a26' : '#f4f6f8'
      })()
    </script>
    <meta
      name="description"
      content="Docklane connects inventory, orders, and fulfillment in one thoughtful workspace. Explore the interactive demo."
    />
    <title>Docklane | Your operations, in motion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
